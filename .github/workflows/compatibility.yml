name: Compatibility

# The fast tests with the latest versions of all dependencies, also with
# pre-releases (e.g. of scikit-learn), to find incompatibilities before a
# release of a dependency.
on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (latest versions)
    runs-on: ubuntu-latest
    # For all steps, because `uv run --locked` fails if the pre-release mode
    # differs from the one of the lockfile:
    env:
      UV_PRERELEASE: allow
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - run: uv lock --upgrade
      - run: uv run --locked pytest --numprocesses=auto
